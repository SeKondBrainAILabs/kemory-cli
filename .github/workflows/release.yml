name: Release

# A `vX.Y.Z` tag releases the CLI everywhere it is installed from:
#
#   1. GitHub Release in this repo   GoReleaser: archives, checksums, provenance
#   2. Homebrew tap                  the same archives as `cli-vX.Y.Z` on
#                                    SeKondBrainAILabs/homebrew-s9n, plus the
#                                    regenerated formula
#   3. npm `kemory`                  the launcher, which downloads and verifies
#                                    the archive from (2)
#   4. PyPI `kemory`                 one wheel per platform carrying the binary
#   5. MCP Registry                  io.github.SeKondBrainAILabs/kemory, pointing
#                                    at (3); server.json at the repo root
#
# Pre-release tags (anything with a "-", e.g. v0.7.0-rc.1) stop after (1).
#
# One-time setup:
#   - repo variable HOMEBREW_RELEASE_APP_ID and secret
#     HOMEBREW_RELEASE_APP_PRIVATE_KEY: a GitHub App with Contents:write on
#     homebrew-s9n only
#   - environments `npm` and `pypi`
#   - npm package `kemory`: trusted publisher for this repo, workflow
#     release.yml, environment npm, "Allow npm publish" ticked
#   - PyPI project `kemory`: trusted publisher for this repo, workflow
#     release.yml, environment pypi

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  TAP_REPO: SeKondBrainAILabs/homebrew-s9n

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    permissions:
      contents: write      # create the GitHub Release
      id-token: write      # sign the build provenance
      attestations: write  # store it
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false # never restore a cache another workflow could have written

      - id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.18.2
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Write one .sha256 per archive
        # The npm launcher and the formula each verify one archive against its
        # own sidecar, holding the bare hex digest.
        run: |
          set -euo pipefail
          while read -r hash name; do
            printf '%s\n' "$hash" > "dist/$name.sha256"
          done < dist/checksums.txt
          ls -la dist/*.sha256

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
            dist/checksums.txt

  homebrew:
    needs: goreleaser
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: dist

      - name: Mint tap-repo token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          client-id: ${{ vars.HOMEBREW_RELEASE_APP_ID }}
          private-key: ${{ secrets.HOMEBREW_RELEASE_APP_PRIVATE_KEY }}
          owner: SeKondBrainAILabs
          repositories: homebrew-s9n
          permission-contents: write

      - name: Publish the archives to the tap and regenerate the formula
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION: ${{ needs.goreleaser.outputs.version }}
        run: |
          set -euo pipefail
          tag="cli-v$VERSION"
          cd dist
          gh release create "$tag" --repo "$TAP_REPO" --title "kemory CLI $tag" \
            --notes "kemory CLI $VERSION. Install: \`brew install sekondbrainailabs/s9n/kemory\`. Source: https://github.com/SeKondBrainAILabs/kemory-cli/releases/tag/v$VERSION" \
            kemory-*.tar.gz kemory-*.zip kemory-*.sha256
          sha() { tr -d '[:space:]' < "kemory-$1.tar.gz.sha256"; }
          base="https://github.com/$TAP_REPO/releases/download/$tag"
          cd "$GITHUB_WORKSPACE"
          git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/$TAP_REPO.git" tap
          cat > tap/Formula/kemory.rb <<EOF
          # This file is generated by the kemory-cli release workflow. Do not edit by hand.
          class Kemory < Formula
            desc "Kemory CLI: connect MCP clients to your Kemory memory vault"
            homepage "https://github.com/SeKondBrainAILabs/kemory-cli"
            version "$VERSION"
            license "MIT"

            on_macos do
              on_arm do
                url "$base/kemory-macos-arm64.tar.gz"
                sha256 "$(cd dist && sha macos-arm64)"
              end
              on_intel do
                url "$base/kemory-macos-x64.tar.gz"
                sha256 "$(cd dist && sha macos-x64)"
              end
            end

            on_linux do
              on_arm do
                url "$base/kemory-linux-arm64.tar.gz"
                sha256 "$(cd dist && sha linux-arm64)"
              end
              on_intel do
                url "$base/kemory-linux-x64.tar.gz"
                sha256 "$(cd dist && sha linux-x64)"
              end
            end

            livecheck do
              url "https://github.com/$TAP_REPO"
              strategy :github_latest
            end

            def install
              bin.install "kemory"
              # Generated from the installed binary, so completions always
              # match the commands this build has.
              generate_completions_from_executable(bin/"kemory", "completion")
            end

            test do
              assert_match "version $VERSION", shell_output("#{bin}/kemory --version")
            end
          end
          EOF
          cd tap
          git config user.name "kemory-release[bot]"
          git config user.email "kemory-release@users.noreply.github.com"
          git add Formula/kemory.rb
          git commit -m "kemory $VERSION"
          git push origin HEAD

  npm:
    needs: [goreleaser, homebrew]
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/kemory
    permissions:
      contents: read
      id-token: write # npm trusted publishing and provenance
    defaults:
      run:
        working-directory: packaging/npm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Set the package version
        env:
          VERSION: ${{ needs.goreleaser.outputs.version }}
        run: npm version "$VERSION" --no-git-tag-version

      - name: Test the launcher
        run: node --test test/launcher.test.js

      - name: Verify the package holds only the launcher
        run: |
          set -euo pipefail
          npm pack --dry-run --json > /tmp/pack.json
          node - <<'EOF'
          const files = require("/tmp/pack.json")[0].files.map((f) => f.path).sort();
          const expected = ["LICENSE", "README.md", "bin/kemory.js", "package.json"];
          console.log(files.join("\n"));
          if (JSON.stringify(files) !== JSON.stringify(expected)) {
            console.error(`::error::npm package files ${JSON.stringify(files)} != ${JSON.stringify(expected)}`);
            process.exit(1);
          }
          EOF

      - name: Smoke-test against the tap release
        run: |
          set -euo pipefail
          export KEMORY_NPX_CACHE="$RUNNER_TEMP/kemory-npx"
          node bin/kemory.js --version
          node bin/kemory.js --env prod mcp serve < /dev/null

      - name: Publish
        run: npm publish --access public --provenance

  mcp-registry:
    # Lists the npm package in the official MCP Registry as
    # io.github.SeKondBrainAILabs/kemory. GitHub OIDC grants this repo's
    # owner namespace; an interactive `mcp-publisher login github` cannot, so
    # this runs here and not by hand. The registry checks the published npm
    # version's mcpName against server.json's name.
    needs: [goreleaser, npm]
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # MCP Registry OIDC login
    env:
      MCP_PUBLISHER_VERSION: v1.8.5
      MCP_PUBLISHER_SHA256: 2d151ac57275c9a6684d9d22b1cba81058bab195ea0a162e8fce3c6a5ec32812
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mcp-publisher
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/mcp-publisher.tar.gz"
          curl -fsSL -o "$archive" \
            "https://github.com/modelcontextprotocol/registry/releases/download/$MCP_PUBLISHER_VERSION/mcp-publisher_linux_amd64.tar.gz"
          echo "$MCP_PUBLISHER_SHA256  $archive" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP" mcp-publisher

      - name: Set the server version
        env:
          VERSION: ${{ needs.goreleaser.outputs.version }}
        run: |
          set -euo pipefail
          jq --arg v "$VERSION" '.version = $v | .packages[0].version = $v' server.json > "$RUNNER_TEMP/server.json"
          mv "$RUNNER_TEMP/server.json" server.json

      - name: Wait for the npm version to carry mcpName
        env:
          VERSION: ${{ needs.goreleaser.outputs.version }}
        run: |
          set -euo pipefail
          want="$(jq -r .name server.json)"
          for _ in $(seq 1 12); do
            got="$(curl -fsS "https://registry.npmjs.org/kemory/$VERSION" | jq -r '.mcpName // empty' || true)"
            if [ "$got" = "$want" ]; then exit 0; fi
            sleep 10
          done
          echo "::error::kemory@$VERSION on npm has mcpName '$got', want '$want'"
          exit 1

      - name: Publish
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/mcp-publisher" validate
          "$RUNNER_TEMP/mcp-publisher" login github-oidc
          "$RUNNER_TEMP/mcp-publisher" publish

  opencode-plugin:
    # opencode-kemory, OpenCode's npm plugin, released with the CLI. npm takes
    # trusted publishing only for a package that exists, so its first version
    # is published by hand; until then this job skips.
    needs: [goreleaser, npm]
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/opencode-kemory
    permissions:
      contents: read
      id-token: write # npm trusted publishing and provenance
    defaults:
      run:
        working-directory: packaging/opencode
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Check the package exists
        id: exists
        run: |
          if npm view opencode-kemory name > /dev/null 2>&1; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::opencode-kemory is not on npm yet; publish its first version by hand"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set the package version
        if: steps.exists.outputs.publish == 'true'
        env:
          VERSION: ${{ needs.goreleaser.outputs.version }}
        run: npm version "$VERSION" --no-git-tag-version

      - name: Verify the package
        if: steps.exists.outputs.publish == 'true'
        run: |
          set -euo pipefail
          node --check index.js
          npm pack --dry-run --json > /tmp/pack.json
          node - <<'EOF'
          const files = require("/tmp/pack.json")[0].files.map((f) => f.path).sort();
          const expected = ["LICENSE", "README.md", "index.js", "package.json"];
          console.log(files.join("\n"));
          if (JSON.stringify(files) !== JSON.stringify(expected)) {
            console.error(`::error::npm package files ${JSON.stringify(files)} != ${JSON.stringify(expected)}`);
            process.exit(1);
          }
          EOF

      - name: Publish
        if: steps.exists.outputs.publish == 'true'
        run: npm publish --access public --provenance

  pypi:
    needs: goreleaser
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/kemory/
    permissions:
      contents: read
      id-token: write # PyPI trusted publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: dist

      - name: Build the wheels
        env:
          VERSION: ${{ needs.goreleaser.outputs.version }}
        run: python3 packaging/pypi/build_wheels.py --version "$VERSION" --dist dist --out dist/wheels

      - name: Smoke-test the linux-x64 wheel
        env:
          VERSION: ${{ needs.goreleaser.outputs.version }}
        run: |
          set -euo pipefail
          python3 -m venv /tmp/smoke
          /tmp/smoke/bin/pip install dist/wheels/kemory-*-manylinux_2_17_x86_64*.whl
          /tmp/smoke/bin/kemory --version | grep -F "version $VERSION"
          /tmp/smoke/bin/kemory --env prod mcp serve < /dev/null

      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/wheels/
